org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Kotlin daemon is a separate JVM: without this it inherits the OS charset
# (Cp1251 on Ukrainian Windows) and misreads UTF-8 .kt sources, baking
# mojibake string literals into the APK. Symptoms: garbled Ukrainian UI.
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false
android.nonTransitiveRClass=false
org.gradle.java.installations.auto-download=true
android.overridePathCheck=true
