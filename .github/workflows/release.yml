name: Release per-ABI APKs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build per-ABI release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          ls -lh app/build/outputs/apk/release/

      - name: Rename to release assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          OUT="app/build/outputs/apk/release"
          cp "$OUT/app-arm64-v8a-release.apk"   "PocketHost-${TAG}-arm64-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "PocketHost-${TAG}-armeabi-v7a.apk"
          cp "$OUT/app-x86_64-release.apk"      "PocketHost-${TAG}-x86_64.apk"
          ls -lh PocketHost-*.apk
          sha256sum PocketHost-*.apk | tee SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PocketHost-*.apk
            SHA256SUMS.txt
          generate_release_notes: true
